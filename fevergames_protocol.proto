//  证据:
//    Minecraft.Windows.exe (74,140,680 B) → /im /log
//      头: X-Gvm / X-IhM / X-KZn / X-KoF / X-d3z / X-qET / X-zEhGO
//    mcl.common.dll        → 头 X-Ye38 / X-np0
//    mcl.common.gray.dll   → 头 X-tRtzc
//    RakNet.dll            → 联机 UDP 二进制协议 (RakNet 兼容层)
//  说明: 基岩版复用与 Java 版同一套 UniSDK 通信层 (NtUniSdk* 成对存在)，
//        下列消息为基岩版客户端自身直连的服务端接口。
// ===========================================================================

message BedrockImRequest {                // /im 即时消息/联机信令
  string user_id   = 1;
  string session   = 2;
  string room_id   = 3;
  string content   = 4;
  int32  msg_type  = 5;
  string extra     = 6;
  string device_id = 7;
  int64  ts        = 8;
}

message BedrockImResponse {
  int32  code      = 1;
  string msg_id    = 2;
  string server_ts = 3;
  repeated BedrockImRequest messages = 4;
}

message BedrockLogRequest {               // /log 客户端日志/遥测
  string user_id   = 1;
  string device_id = 2;
  string version   = 3;
  string level     = 4;
  repeated string entries = 5;
  string crash_id  = 6;
  int64  ts        = 7;
}

message BedrockSessionInfo {              // 基岩版会话/联机房间
  string room_id      = 1;
  string host_id      = 2;
  string world_id     = 3;
  repeated BedrockPlayer players = 4;
  int32  max_players  = 5;
  string version      = 6;
  bool   invite_only  = 7;
  string join_code    = 8;
}

message BedrockPlayer {
  string user_id   = 1;
  string gamertag  = 2;
  string xuid      = 3;   // Xbox Live ID
  string skin_id   = 4;
  int32  permission = 5;
  int64  join_ts   = 6;
}

// ---------------------------------------------------------------------------
// RakNet 联机层 (UDP, 二进制)
//   本测绘不还原其二进制线格式；仅登记外层封装与已知消息族。
//   RakNet 标准离线握手/在线消息语义见 upstream 规范。
// ---------------------------------------------------------------------------
message RakNetDatagram {
  uint32 packet_type   = 1;   // RakNet 消息 ID
  uint64 send_time     = 2;
  bytes  payload       = 3;   // 内部位流 (位对齐, 未还原, E3)
  int32  reliability   = 4;
  uint32 ordering_index = 5;
  uint32 ordering_channel = 6;
  bytes  frame_set     = 7;
}

// ===========================================================================
// P11  反作弊与环境检测平面
//  证据: libenvsdk.dll (头 X-ptn) / WinlicenseSDK / SecureEngineSDK32 /
//        Snappy.NET / XOREncryptDLL.dll / detect 模块
//  说明: 本平面只登记 <上报字段存在性>，不还原其判定逻辑或绕过方式。
// ===========================================================================

message EnvSdkReportRequest {             // libenvsdk.dll 环境上报 (头 X-ptn)
  string device_id   = 1;
  string user_id     = 2;
  string app_id      = 3;
  string os_version  = 4;
  string cpu         = 5;
  string gpu         = 6;
  string memory      = 7;
  string disk        = 8;
  string mac         = 9;
  string volume_serial = 10;
  repeated string processes = 11;   // 检测到的可疑进程名单
  repeated string modules   = 12;   // 已加载模块名单
  bool   debugger    = 13;
  bool   virtual_machine = 14;
  string integrity   = 15;   // 完整性校验字段 (值语义未还原, E3)
  string scene       = 16;
}

message EnvSdkReportResponse {
  int32  code     = 1;
  int32  verdict  = 2;   // 判定结果枚举 (语义未还原, E3)
  string action   = 3;
  int64  next_probe_ms = 4;
}

// ===========================================================================
// P12  WebView 宿主平面
//  证据: cefwebview.dll / webview_support_helper.dll / webview_support.dll
//        (CEF 运行时; 缓存与 Local Storage 提供真实会话状态证据)
//  说明: 承载 mpay 支付页、实名页、活动页等 H5 流程。
// ===========================================================================

message WebviewOpenRequest {              // 宿主 → CEF 打开页面
  string url          = 1;
  string title        = 2;
  bool   modal        = 3;
  int32  width        = 4;
  int32  height       = 5;
  map<string, string> headers = 6;
  string inject_js    = 7;
  bool   cookie_share = 8;
  string scene        = 9;
}

message WebviewJavascriptBridge {         // JS ↔ Native 桥消息
  string callback_id = 1;
  string method      = 2;
  string params      = 3;   // JSON 串
  string result      = 4;
  int32  error_code  = 5;
}

// ===========================================================================
// X  跨平面：CDN 内容寻址与本地会话状态
// ===========================================================================

// 7.1 x19 CDN 内容寻址结构
//   x19-h.gdl.netease.com         → /{hex16}/{decimal20}.index
//   x19.fp.ps.netease.com         → /file/<hex24><base62>NN
//   x19.gdl.netease.com           → 更新/资源分发
message CdnContentAddress {
  string host       = 1;   // x19-h.gdl.netease.com 等
  string hex16      = 2;   // 16 位十六进制前缀 (分桶)
  string decimal20  = 3;   // 20 位十进制版本/内容号
  string file_id    = 4;   // hex24 + base62 后缀
  string suffix     = 5;   // NN
  string index_path = 6;   // /{hex16}/{decimal20}.index
  string file_path  = 7;   // /file/<...>
}

message CdnIndexFile {                    // .index 内容结构 (E2)
  string version    = 1;
  repeated ManifestFileEntry files = 2;
  uint64 total_size = 3;
  string manifest_hash = 4;
}

// 7.2 本地持久化会话状态 (来自 CEF 缓存 / 配置文件的实证字段)
message LocalSessionState {
  string udid        = 1;
  string unique_id   = 2;
  string uuid        = 3;
  string device_id   = 4;
  string machine_id  = 5;
  string user_id     = 6;
  string nickname    = 7;
  string avatar      = 8;
  string loadingbay_token = 9;   // 仅登记字段存在性；不做凭据登录实现
  string session_id  = 10;
  string channel     = 11;
  string install_id  = 12;
  int64  login_ts    = 13;
  int64  last_run_ts = 14;
  string install_dir = 15;
  string version     = 16;
  string locale      = 17;
}

message LocalLauncherConfig {             // 启动器本地配置
  repeated string servers        = 1;
  string  last_server           = 2;
  repeated string protocol_hosts = 3;
  string  httpdns_host          = 4;
  bool    enable_orbit          = 5;
  bool    enable_p2p            = 6;
  int32   download_thread       = 7;
  string  download_ipc_endpoint = 8;   // 127.0.0.1:5000 / :7000
  string  channel               = 9;
  map<string, string> extra     = 10;
}

// 7.3 通用错误响应 (跨平面)
message ErrorResponse {
  int32  code       = 1;
  string message    = 2;
  string trace_id   = 3;
  int64  server_ts  = 4;
  string detail     = 5;
  string retry_after = 6;
}

