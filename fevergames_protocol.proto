// ============================================================================
//  P1. UniSDK 通用通信层
//  Java 版与基岩版共用同一套模块 (NtUniSdk* 在 MC\ 与 MCBedrock\ 成对存在,
//  体积/内容近逐字节相同)。双域名冗余: netease.com / easebar.com 成对。
// ============================================================================

// ---- 1.1 身份公告 (whoami) ----
// 端点: https://whoami.nie.{netease,easebar}.com/v6
//       https://who.{easebar,nie}.com/v2      (旧版, NtUniSdkProtocol 使用)
//       https://who.nie.163.com               (CEF 缓存实证, 已废弃入口)
// 证据: [E1] whoami/ v6 与 httpdns/impression 同族出现; CEF 缓存含 who.nie.163.com
message WhoAmIRequest {
  string deviceid    = 1;  // 设备指纹, 形如 00:50:56:C0:00:01
  string channel     = 2;  // 分发渠道, 官方为 mkt-x19-official
  string sub_channel = 3;
  string version     = 4;  // w1.18.42.14
  string region      = 5;  // 如 US
  string locale      = 6;  // 如 zh_Hans
  string lang        = 7;  // 如 zh_Hans
  string os_type     = 8;  // 如 windesktop
  string udid        = 9;  // [E1] nlib.dat 键
  string unique_id   = 10; // [E1] nlib.dat 键
}

message WhoAmIResponse {
  string uid         = 1;
  string deviceid    = 2;
  string session     = 3;  // (?) 会话标识
  int64  server_time = 4;
  string uuid        = 5;  // [E1] nlib.dat 键
}

// ---- 1.2 SDK 协议模板分发 ----
// 端点: https://protocol.unisdk.netease.com/api/template/v89/latest.json
//       https://unisdk.update.netease.com/html/latest_v89.json
//       https://unisdk.update.netease.com/html/latest_v165.html   (JS 变体)
//       https://unisdk.update.netease.com/html/latest_default.json (CEF 实证)
//       https://protocol.unisdk.netease.com/release/latest_v15.html
//       https://unisdk.update.netease.com/assets/protocol/           (CEF 实证)
//       https://protocol.unisdk.netease.com/tpsl/pc_class
message ProtocolTemplate {
  string version                 = 1;  // 模板版本 (路径 v89 / v165 / v15)
  repeated ProtocolEntry entries = 2;
  bool   enable                  = 3;
  repeated string params         = 4;
}

message ProtocolEntry {
  string name   = 1;
  string url    = 2;
  string hash   = 3;
  uint64 bytes  = 4;   // 资源大小, 与 hash 配对构成资源清单项
  string md5    = 5;
  string type   = 6;
  bool   enable = 7;
}

// ---- 1.3 功能开关 / 灰度 (feature2) ----
// 端点: https://g0.gsf.{netease,easebar,easbar}.com/feature2
// 证据: [E1] NtUniSdkMpay / RoostX / Orbit / Pharos / FaceDetect 同族引用
message FeatureToggleRequest {
  string project        = 1;
  string channel        = 2;
  string sub_channel    = 3;
  string version        = 4;
  repeated string keys  = 5;
  string udid           = 6;
}

message FeatureToggleResponse {
  int32  code               = 1;
  string msg                = 2;
  repeated FeatureItem items = 3;
}

message FeatureItem {
  string key   = 1;
  string value = 2;
  string type  = 3;
  int64  ttl   = 4;
}

// ---- 1.4 HTTPDNS 与 hdserver 寻址 ----
// 端点: https://httpdns.nie.{netease,easebar}.com/v2/
//       https://dns.update.{netease,easebar}.com/hdserver
//       https://%s/v2?domain=%s   (NtUniSdkOrbit / AudioService 实证)
// 说明: hdserver 返回与 /feature2 相同的开关壳, 但用于下发 DNS 加速配置。
message HttpDnsRequest {
  repeated string domains = 1;
  string project          = 2;
  string sdk_version      = 3;
}

message HttpDnsResponse {
  int32  code                      = 1;
  string msg                       = 2;
  repeated HttpDnsRecord records   = 3;
}

message HttpDnsRecord {
  string domain          = 1;
  repeated string ips    = 2;
  int32  ttl             = 3;
  string cname           = 4;
}

// ---- 1.5 RoostX / MGB 回退域名清单 ----
// 端点: https://mgb.update.{netease,easebar}.com/fallback.list
//       https://mgb.update.{netease,easebar}.com/fallbacktest.list
//       https://dep410.update.easebar.com/   (基岩版 RoostX 专有)
//       https://8.8.8.8/resolve              (明文 DNS 回退)
message FallbackListRequest {
  string project  = 1;
  string version  = 2;
  string platform = 3;
}

message FallbackListResponse {
  repeated FallbackEndpoint endpoints = 1;
  int64  update_time                  = 2;
}

message FallbackEndpoint {
  string host     = 1;
  int32  port     = 2;
  string protocol = 3;   // http / https / udp / tcp
  int32  weight   = 4;
}

// ---- 1.6 SDK 日志上传 (applog.matrix) ----
// 端点: https://applog.matrix.{netease,easebar}.com/client/sdk/
//         {clientlog, ff_log, open_log, pay_log}
// 证据: [E1] 多模块共用; pay_log 仅 MPayCliCppWrapper.dll 引用
message SdkLogUpload {
  string project       = 1;
  string channel       = 2;
  string sdk_version   = 3;
  string uid           = 4;
  string udid          = 5;
  string log_type      = 6;   // clientlog / ff_log / open_log / pay_log
  string content       = 7;
  int64  timestamp     = 8;
  string width         = 9;   // [E1] pay_log 专有 (MPayCliCppWrapper)
  string height        = 10;
  string anchor        = 11;
  string channel_ui    = 12;  // [E2] 对应 "channel"
}

// ---- 1.7 UniSDK 模块级端点索引 (登记用, 非线上报文) ----
// 所有模块共享认证头族:
//   {Authorization, Cookie, Timestamp, Signature, Nonce, X-Client-Sign, User-Agent}
message UniSdkModuleEntry {
  string module            = 1;  // NtUniSdkBase / Mpay / Orbit / RoostX / ...
  Plane  plane             = 2;
  string base_url          = 3;
  repeated string paths    = 4;
  repeated ObservedHeader headers = 5;
}

// ---- 1.8 TPSL 分类上报 / 客户端加密数据 ----
// 端点: https://tpsl.nie.netease.com/api/v1/class/upload
//       {loadingbay}/v1/client/unisdk_encrypt_data
message TpslClassUpload {
  string project   = 1;
  string uid       = 2;
  string class_id  = 3;   // (?) 分类标识
  string payload   = 4;   // 加密体 [E3]
  int64  timestamp = 5;
}

message UnisdkEncryptData {
  string data      = 1;   // SDK 侧加密后的不透明串 [E3]
  string version   = 2;
  int64  timestamp = 3;
}

// ============================================================================
//  P2. pharos 网络探测 / 路径优化层
//  组件: FeverApps\MC\pharos.dll (1024512 B) 与 FeverApps\MCBedrock\pharos.dll
//        (1170944 B) —— 两份近同源, 基岩版略大。
//  域名: pharos.{netease,easebar}.com        (主控制面)
//        dual.pharos.{netease,easebar}.com   (双栈 IPv4+IPv6)
//        explore.pharos.{netease,easebar}.com(探测探针)
//        sigma-pharosv3-pathn.proxima.nie.{netease,easebar}.com
//        service.mkey.163.com                (鉴权旁路)
//        www.baidu.com                       (可达性基线探测)
//  头:   X-Pharos-Id / X-Pharos-Ver / X-Content-Type
// ============================================================================

// 探测任务下发。GET /v1/tasks/  (返回待探测目标清单)
message PharosTasksRequest {
  string project        = 1;
  string version        = 2;   // 对应 JSON 键 "version"
  string pharos_id      = 3;   // X-Pharos-Id
  string pharos_ver     = 4;   // X-Pharos-Ver
  string protocol       = 5;   // 期望协议族 (tcp / udp / http / https)
  int32  timeout        = 6;   // 单目标超时 (ms)
  int32  interval       = 7;   // 探测间隔 (ms)
  int32  fetch_interval = 8;   // 拉取任务的间隔 (ms)
  int32  max_threads    = 9;
  int32  max_hop        = 10;  //  traceroute 最大跳数
}

message PharosTasksResponse {
  string client_ip              = 1;   // 服务端观测到的探测源 IP
  int32  count                  = 2;
  repeated PharosTarget targets = 3;
  repeated PharosTask tasks     = 4;
}

message PharosTarget {
  string host  = 1;
  int32  port  = 2;
  string proto = 3;
  string params = 4;
  uint64 size  = 5;   // 探测载荷大小
}

message PharosTask {
  string task_id  = 1;
  string subtype  = 2;
  string protocol = 3;
  repeated PharosTarget targets = 4;
  int32  timeout  = 5;
  bytes  bytes    = 6;   // [E3] 二进制任务体
}

// 设备画像 / 网络画像上报。POST /v1/profiles/
message PharosProfileReport {
  string project    = 1;
  string pharos_id  = 2;
  string pharos_ver = 3;
  string client_ip  = 4;
  string protocol   = 5;
  uint64 size       = 6;
  bytes  bytes      = 7;   // [E3]
}

// 静态资源提速配置。GET /api/v1/static/lighten/
message PharosStaticLighten {
  string project = 1;
  string domain  = 2;
  string path    = 3;
}

// 港湾式探测聚合。POST /api/v1/harbor/
message PharosHarborReport {
  string project  = 1;
  string subtype  = 2;
  repeated PharosTask tasks = 3;
  string params   = 4;
}

// sigma-* 上报 (错误 / v3 版本)
// 端点: https://sigma-pharosv3-pathn.proxima.nie.{netease,easebar}.com/{v3,error}
message PharosSigmaV3Report {
  string project    = 1;
  string pharos_id  = 2;
  string protocol   = 3;
  string client_ip  = 4;
  int32  max_hop    = 5;
  int32  max_threads = 6;
  string params     = 7;
  bytes  bytes      = 8;   // [E3]
}

message PharosErrorReport {
  string project  = 1;
  string code     = 2;
  string reason   = 3;
  string version  = 4;
  string extra    = 5;
}

// ============================================================================
//  P3. loadingbay 客户端业务 API
//  组件: 1.18.42.14\FeverGamesInstaller.exe (80.7 MB, 268 路径)
//        1.18.42.14\FeverGamesPostUpdate.exe (1.59 MB, 96 路径)
//  主机: api.loadingbay.com / loadingbaycn.webapp.163.com
//        loadingbaycn-qa.webapp.163.com / loadingbaycn-client-web-qa.webapp.163.com
//        loadingbaycn-websocket.webapp.163.com / ...-websocket-qa.webapp.163.com
//  专有头 (7): X-A53, X-AUTH-PROJECT, X-AUTH-TOKEN, X-IDATx, X-LVU, X-NHK, X-Y-Z
//  通用头族: Authorization, Cookie, Timestamp, Signature, X-Auth-Token, X-Auth-User
//  说明: 两个 exe 的路径集合高度重叠, 视为同一 API 的两代客户端。
// ============================================================================

// ---- 3.1 登录 / 会话 ----
// POST /v1/login          POST /v1/login/logout    POST /v1/login/mock
// POST /v1/login/on_guest_bind_account             GET  /v1/login/state
// POST /v1/login/ticket   POST /v1/login/tourist   POST /v1/login/ws_token
// POST /login/mpay_ticket (mpay 票据换取 loadingbay 会话)
message LoginRequest {
  string account         = 1;
  string token           = 2;   // mpay ticket / oauth token
  string login_type      = 3;   // tourist / qrcode / ticket / third_party
  string deviceid        = 4;
  string sdkuid          = 5;   // 路径 /sdkuid 实证
  string gameid          = 6;   // 路径 /gameid 实证
  string channel         = 7;
  string sub_channel     = 8;
  string version         = 9;
  string mpay_ticket     = 10;
  string third_party     = 11;
  string udid            = 12;
}

message LoginResponse {
  int32  code          = 1;
  string msg           = 2;
  string token         = 3;   // 会话票据 (后续 X-AUTH-TOKEN)
  string sdkuid        = 4;
  string uid           = 5;
  string nickname      = 6;
  string avatar        = 7;
  bool   is_tourist    = 8;
  int64  expire_time   = 9;
  string ws_token      = 10;  // /v1/login/ws_token
  string login_state   = 11;  // /v1/login/state
  string usercard      = 12;  // 路径 /usercard
}

// ---- 3.2 用户资料 ----
// GET  /v1/user, /v1/user/online_status, /v1/user/search
// POST /v1/user_settings, /v1/user/game_account, /v1/user/game_account/list
message UserProfile {
  string uid             = 1;
  string nickname        = 2;
  string avatar          = 3;
  string account         = 4;
  string online_status   = 5;
  string region          = 6;
  string age_info        = 7;
  int32  age             = 8;
  bool   pin_authorized  = 9;   // /v1/user/age_info/pin_authorized_action
  string user_settings   = 10;
  string game_account    = 11;
}

message UserSearchRequest {
  string keyword  = 1;
  int32  offset   = 2;
  int32  limit    = 3;
}

// ---- 3.3 第三方账号绑定 ----
// GET/POST /v1/third_party_account, /v1/third_party_account/ticket
message ThirdPartyAccountRequest {
  string platform   = 1;   // qq / weibo / wechat / battlenet
  string ticket     = 2;
  string openid     = 3;
  string action     = 4;   // bind / unbind / query
}

message ThirdPartyAccountResponse {
  int32  code         = 1;
  string msg          = 2;
  repeated ThirdPartyBinding bindings = 3;
}

message ThirdPartyBinding {
  string platform     = 1;
  string nickname     = 2;
  string avatar       = 3;
  bool   bound        = 4;
}

// ---- 3.4 实名 / 防沉迷 / 家长监护 ----
// GET  /v1/game_extend/x20/student_verify      (学生认证)
// GET  /api/account/parent/verify/redirect     (家长验证跳转)
// GET  /api/parent/pin/redirect                (家长 PIN 跳转)
// 关联 SDK 面: NtUniSdkBase -> /api/realname/{query,redirect}
message RealnameVerifyRequest {
  string uid          = 1;
  string realname     = 2;
  string idcard       = 3;   // 明文不上送, SDK 侧加密 [E3]
  string token        = 4;
  string action       = 5;   // query / verify / redirect
  string student_code = 6;   // x20/student_verify
  string pin          = 7;   // 家长 PIN
}

message RealnameVerifyResponse {
  int32  code          = 1;
  string msg           = 2;
  string redirect_url  = 3;
  int32  age           = 4;
  bool   verified      = 5;
  string realname_masked = 6;
  string limit_type    = 7;   // 防沉迷限制类型
  string failed_face_url = 8;
}

// ---- 3.5 游戏库 (game_library) —— 客户端主业务面 ----
// GET/POST /v1/game_library/app              (应用详情)
//          /v1/game_library/app/list         (应用列表)
//          /v1/game_library/app/brief_list   (精简列表)
//          /v1/game_library/app/activity_news(活动资讯)
//          /v1/game_library/app/ownership    (拥有关系)
//          /v1/game_library/app/precheck     (启动前置检查)
//          /v1/game_library/app/startup      (启动)
//          /v1/game_library/app/startup_check(启动检查)
//          /v1/game_library/app/startup_tips (+/action)
//          /v1/game_library/app/exit         (退出上报)
//          /v1/game_library/app/tick         (心跳)
//          /v1/game_library/app/download_check
//          /v1/game_library/app/download_limit/status
//          /v1/game_library/app/platform_check
//          /v1/game_library/app/reg_limit/status
//          /v1/game_library/app/remove
//          /v1/game_library/app/remove_dlc_red_point
//          /v1/game_library/app/reset_all
//          /v1/game_library/app_group
//          /v1/game_library/hidden_app (+/list)
//          /v1/game_library/ticket
message GameAppRequest {
  string app_id          = 1;   // 对应路径 /games/app- 与键 app_id
  string app_content_id  = 2;
  string project_id      = 3;
  string gameid          = 4;
  string channel         = 5;
  string version         = 6;   // version_code
  string platform        = 7;
  string action          = 8;
  string dlc_id          = 9;
  bool   need_dlc        = 10;
  int32  offset          = 11;
  int32  limit           = 12;
}

message GameAppInfo {
  string app_id           = 1;
  string name             = 2;
  string icon             = 3;
  string brief            = 4;
  string version          = 5;
  uint64 bytes            = 6;   // 安装体积
  string status           = 7;   // 未安装 / 已安装 / 可更新
  string download_url     = 8;
  string manifest_url     = 9;
  string manifest_xxh     = 10;  // downloadIPC 同名字段
  bool   owned            = 11;
  bool   hidden           = 12;
  repeated GameDlc dlcs   = 13;
  string startup_tips     = 14;
  string activity_news    = 15;
  string group            = 16;  // app_group
  bool   reg_limited      = 17;
  bool   download_limited = 18;
  bool   platform_ok      = 19;
  string ticket           = 20;  // /v1/game_library/ticket
}

message GameDlc {
  string dlc_id            = 1;
  string app_id            = 2;
  string name              = 3;
  string version           = 4;
  uint64 bytes             = 5;
  bool   owned             = 6;
