syntax = "proto3";

// ============================================================================
//  网易我的世界启动器 (FeverGames / NetEase Minecraft Launcher)
//  网络协议结构定义 逆向测绘产出
// ============================================================================
//
//  来源: 静态字符串提取 + 运行时证据 (CEF 缓存 / LevelDB / 崩溃转储)
//  目标: Java 版 (FeverApps\MC\*, 1.18.42.14\*) 与 基岩版 (FeverApps\MCBedrock\*)
//
//  【重要边界声明】
//  本文件只描述可观察到的 <线格式结构> (wire format)，用于协议互操作研究与
//  安全分析。不包含、也不应被用于实现:
//    - 伪造官方客户端身份的凭据登录 (LOADINGBAY_TOKEN / X-Client-Sign 签名)
//    - 绕过任何身份验证、风控、实名或支付校验的机制
//  SDK 侧的签名算法 (X-Client-Sign / Nonce / Timestamp 组合) 属于密钥派生逻辑,
//  本测绘不还原其算法，只登记字段存在性与位置。
//
//  字段命名约定: 逆向所得原始字段名保留原样 (snake_case)。无法确定类型的一律
//  使用 string 并在注释标注 (?)。
// ============================================================================
//
//    组件数 102 / 域名 289 / 请求头 110 / 路径 562 / URL 231
//
//  通信平面 (P1–P12):
//    P1  UniSDK 通用通信层      NtUniSdk{Base,Protocol,Mpay,Orbit,RoostX,Pharos,
//                               FaceDetect,NgWebview,NgPersonalInfoList,Share,
//                               QRCode,NeteaseH5Payment,Resources}
//    P2  pharos 网络探测层      pharos.dll (Java + 基岩版各一份)
//    P3  loadingbay 业务 API    FeverGamesInstaller.exe / FeverGamesPostUpdate.exe
//    P4  mpay 账号与支付        mpay.dll (三份成对) + Netease.Ncg.Pay.dll
//    P5  Orbit P2P / CDN        OrbitSDK.dll / NtUniSdkOrbit.dll
//    P6  下载与内容寻址         downloadIPC.exe (Go) / *.fp.ps.netease.com
//    P7  更新与安装             MCLauncherUpdater.exe / FeverGamesUpdate.exe /
//                               nlib.dat / uninstall.dat (Inno Setup)
//    P8  崩溃上报               CrashHunter_PC3.dll / myappdump.dll / UniCrashReporter
//    P9  实时媒体与直播         网易 CC 全栈 / xyvodsdk.dll / VideoPlayer.dll / WebRtc.dll
//    P10 基岩版客户端           Minecraft.Windows.exe / mcl.common*.dll / RakNet.dll
//    P11 反作弊与环境检测        libenvsdk.dll / WinlicenseSDK / XOREncryptDLL
//    P12 WebView 宿主           cefwebview.dll / webview_support_helper.dll
//
//  取证等级标注 (逐条):
//    [E1] 直接实证 —— 字符串 / JSON 键 / URL 原文出现在二进制或运行时缓存
//    [E2] 推导     —— 由同模块同族接口上下文推导, 未经运行时验证
//    [E3] 未还原   —— 仅知其存在 (端点 / 头名), 载荷语义未还原
// ============================================================================

package netease.fevergames.v1;

option go_package = "fevergames/v1;fevergamesv1";
option java_package = "com.netease.fevergames.proto";
option java_multiple_files = true;
option csharp_namespace = "Netease.FeverGames.V1";

// ============================================================================
//  0. 通用类型 / 枚举
// ============================================================================

// 统一 JSON 外层。多数业务接口共用外层壳。
// 键名 [E1] 来自各模块字符串提取的 JSON 键集合。
message HttpEnvelope {
  int32  code        = 1;
  string msg         = 2;
  string desc        = 3;
  string error       = 4;
  string data        = 5;  // 载荷占位; 具体 schema 见各接口 message
  int64  server_time = 6;
  string extra       = 7;
  string type        = 8;
  string method      = 9;
  string body        = 10;
}

// 语义未还原的原始 HTTP 载荷。用于 P10 (Minecraft.Windows.exe) 与
// P12 (cefwebview) 等被混淆/加壳的组件 —— 只见端点与头名, 不见 body 结构。
message RawPayload {
  bytes  body         = 1;  // [E3] 未解
  uint32 path_version = 2;  // 路径 /vN 中的 N (混淆版本前缀)
}

// JSON-RPC 2.0 风格封装。
// [E1] 实证于 1.18.42.14/backup_tools/fg_dl.exe (aria2 派生的下载后端)。
message JsonRpcCall {
  string jsonrpc = 1;  // "2.0"
  string method  = 2;
  string id      = 3;
  string params  = 4;  // 可为对象/数组 (aria2 多元参数)
  string result  = 5;
  string error   = 6;
}

// 遥测 / 埋点事件。
// [E1] 键名并集来自 nlib.dat (17 键) 与 CrashHunter/UniCrashReporter (event_info)。
// 端点族: applog.matrix.{netease,easebar}.com/client/sdk/*
//         sigma-fcount-webtech.proxima.nie.netease.com
//         impression.update.{netease,easebar}.com/{orbit/v3/,logcatch/...}
message TelemetryEvent {
  string event        = 1;
  string project      = 2;
  string project_id   = 3;
  string session_id   = 4;
  string unique_id    = 5;
  string udid         = 6;
  string uuid         = 7;
  string channel      = 8;
  string sub_channel  = 9;
  string version      = 10;
  string state        = 11;
  string source       = 12;
  string type         = 13;
  string branch_tag   = 14;
  string secret       = 15;
  string index        = 16;
  int64  timestamp    = 17;
  string error_reason = 18;
  string event_info   = 19;
}

// HTTP 方法 (去噪后实际观察到的集合)
enum HttpMethod {
  HTTP_METHOD_UNSPECIFIED = 0;
  HTTP_METHOD_GET         = 1;
  HTTP_METHOD_HEAD        = 2;
  HTTP_METHOD_OPTIONS     = 3;
  HTTP_METHOD_POST        = 4;
  HTTP_METHOD_PUT         = 5;
  HTTP_METHOD_PATCH       = 6;
  HTTP_METHOD_DELETE      = 7;
}

// 通信平面
enum Plane {
  PLANE_UNSPECIFIED         = 0;
  PLANE_UNISDK_CORE         = 1;   // P1
  PLANE_PHAROS_PROBE        = 2;   // P2
  PLANE_LOADINGBAY_API      = 3;   // P3
  PLANE_MPAY_ACCOUNT_PAY    = 4;   // P4
  PLANE_ORBIT_PCDN          = 5;   // P5
  PLANE_DOWNLOAD_CDN        = 6;   // P6
  PLANE_UPDATE_INSTALL      = 7;   // P7
  PLANE_CRASH_REPORT        = 8;   // P8
  PLANE_REALTIME_MEDIA      = 9;   // P9
  PLANE_BEDROCK_CLIENT      = 10;  // P10
  PLANE_ENV_ANTICHEAT       = 11;  // P11
  PLANE_WEBVIEW_HOST        = 12;  // P12
}

