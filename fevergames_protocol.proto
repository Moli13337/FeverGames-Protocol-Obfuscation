// ===========================================================================
// P4  mpay 账号与支付平面
//  证据: mpay.dll (9,406,968 B, 153 路径) / mpay_interface.dll /
//        MPayCliCppWrapper.dll / Netease.Ncg.Pay.dll
//  传输头: X-JMGq / X-Mpay-Timestamp (+ 通用 X-Client-Sign)
//  注: 支付结果校验与票据兑换的回调验签属密钥派生逻辑, 本测绘只登记字段位置。
// ===========================================================================

